worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" $request_time';

    access_log /dev/stdout main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;

    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    server {
        listen 8080;
        server_name frozen-repo.internal localhost;

        location /healthz {
            access_log off;
            return 200 'OK\n';
            add_header Content-Type text/plain;
        }

        location / {
            # The upstream Host header MUST match the frozen S3 bucket the sidecar
            # proxy signs for, or SigV4 fails with 403. This __S3_HOST__ token is
            # substituted at container start by entrypoint.sh from $S3_HOST
            # (derived from S3_BUCKET / S3_REGION), so the signer and this Host
            # header stay in lockstep and nothing is hardcoded.
            proxy_pass http://127.0.0.1:9090;
            proxy_set_header Host __S3_HOST__;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 10s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }
    }
}
